AWSTemplateFormatVersion: '2010-09-09'
Description: 'Enable Guardduty'
Parameters:
  resourcePrefix:
    Type: String
Resources:
  Detector:
      Type: AWS::GuardDuty::Detector
      Properties:
          Enable: True
          FindingPublishingFrequency: FIFTEEN_MINUTES
          # Use Features rather than the deprecated DataSources property; DataSources causes
          # CloudFormation updates to fail with "#/Features: expected type: JSONArray".
          Features:
            - Name: S3_DATA_EVENTS
              Status: ENABLED
            - Name: EKS_AUDIT_LOGS
              Status: DISABLED
            - Name: EBS_MALWARE_PROTECTION
              Status: ENABLED


Outputs:
  DetectorId:
    Value: !Ref Detector
    Export:
      Name: !Sub '${AWS::StackName}-detector-id'
