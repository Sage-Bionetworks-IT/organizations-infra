AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Cross-account role for Bedrock access, scoped to OpenAI and Anthropic
  (Claude) models. Allows all accounts in the organization to assume this
  role.
Parameters:
  OrganizationId:
    Type: String
    Description: The AWS Organization ID (e.g., o-xxxxxxxxxx)
  RoleName:
    Type: String
    Default: BedrockCrossAccountRole
    Description: Name of the IAM role
Resources:
  BedrockCrossAccountRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Ref RoleName
      Policies:
        - PolicyName: BedrockModelAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Restrict model invocation to all OpenAI (openai.*) and
              # Anthropic (Claude) models available on Bedrock. The OpenAI
              # family spans the open-weight gpt-oss models as well as the
              # proprietary GPT-5.6 / GPT-6 models; the openai.* ARN pattern
              # below covers all of them. Some of these models are sold through
              # AWS Marketplace, so the auto-subscribe/enablement statements
              # below cover first use.
              - Sid: AllowInvokeModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/openai.*'
                  - 'arn:aws:bedrock:*:*:inference-profile/*openai.*'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.*'
                  - 'arn:aws:bedrock:*:*:inference-profile/*anthropic.*'
              # OpenAI-compatible endpoint (bedrock-mantle). Clients such as
              # Codex that use the OpenAI SDK / Responses API call this endpoint
              # instead of bedrock-runtime. CreateInference authorizes against
              # the project ARN (not the model ARN), so model-level restriction
              # to OpenAI/Anthropic is NOT expressible on this IAM path. The
              # tightest scoping available here is the project resource: we pin
              # it to this account and Region so that a caller assuming this
              # org-wide role cannot target projects in other accounts/Regions.
              # Provider/model enforcement on the Mantle path must be applied
              # via a service control policy (SCP), per AWS guidance.
              - Sid: AllowBedrockMantleInference
                Effect: Allow
                Action:
                  - bedrock-mantle:Get*
                  - bedrock-mantle:List*
                  - bedrock-mantle:CreateInference
                Resource:
                  - !Sub 'arn:aws:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/*'
              # Web search tool used by the OpenAI-compatible endpoint when a
              # model performs web searches / fetches during inference.
              - Sid: AllowBedrockWebSearch
                Effect: Allow
                Action:
                  - bedrock-websearch:InvokeSearch
                  - bedrock-websearch:InvokeFetch
                Resource: 'arn:aws:bedrock-websearch:*:*:*'
              # Read-only discovery actions needed by the console/SDK to list
              # and describe available models. These are non-mutating.
              - Sid: AllowBedrockModelDiscovery
                Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                  - bedrock:ListFoundationModelAgreementOffers
                  - bedrock:GetFoundationModelAvailability
                Resource: '*'
              # Allow Bedrock to enable/activate a model agreement on first use.
              - Sid: AllowBedrockModelEnablement
                Effect: Allow
                Action:
                  - bedrock:CreateFoundationModelAgreement
                  - bedrock:GetUseCaseForModelAccess
                  - bedrock:PutUseCaseForModelAccess
                Resource: '*'
              # Allow the AWS Marketplace subscription that Bedrock performs on
              # first invoke to enable a serverless model. Product IDs vary
              # across the OpenAI and Anthropic families (and gpt-oss models
              # have none), so ProductId cannot be used to scope this. Instead,
              # the aws:CalledViaLast condition restricts these actions so they
              # can ONLY be used when Bedrock itself is the caller (i.e. the
              # auto-subscribe/enable flow) - not for arbitrary Marketplace
              # purchases made directly by the principal.
              - Sid: AllowBedrockMarketplaceSubscription
                Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Unsubscribe
                Resource: '*'
                Condition:
                  StringEquals:
                    'aws:CalledViaLast':
                      - bedrock.amazonaws.com
                      - bedrock-mantle.amazonaws.com
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:PrincipalOrgID': !Ref OrganizationId
Outputs:
  RoleArn:
    Value: !GetAtt BedrockCrossAccountRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BedrockCrossAccountRoleArn'
